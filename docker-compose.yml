# Datastores for MetaModel integration tests.
#
# Start:      docker compose up -d
# Stop:       docker compose down
#
# The ready-made integration test configuration in
# docker/metamodel-integrationtest-configuration.properties points to these
# services. Copy it to your user home directory to run the PostgreSQL
# integration tests:
#
#   cp docker/metamodel-integrationtest-configuration.properties ~/
#   mvn -pl jdbc -am test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: metamodel
      POSTGRES_PASSWORD: metamodel
      POSTGRES_DB: metamodel_test
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: metamodel
      MYSQL_DATABASE: sakila
      MYSQL_USER: metamodel
      MYSQL_PASSWORD: metamodel
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
