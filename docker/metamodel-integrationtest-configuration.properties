#Configuration file for the integration tests of MetaModel.
#This variant matches the docker-compose.yml in the repository root.
#Copy it to your user home directory to enable the tests:
#
#  cp docker/metamodel-integrationtest-configuration.properties ~/
#
# -----------------------
# JDBC module properties:
# -----------------------

jdbc.postgresql.driver=org.postgresql.Driver
jdbc.postgresql.url=jdbc:postgresql://localhost/metamodel_test
jdbc.postgresql.username=metamodel
jdbc.postgresql.password=metamodel
jdbc.postgresql.longrunningtests=false

# MySQL: the docker-compose setup loads the sakila sample database into the
# mysql container, but the MySQL integration tests were written against
# MySQL 5.x and currently fail with the MySQL 8 server/driver metadata
# (column sizes, view remarks and sakila row counts differ). Enable these
# lines only if you run a MySQL 5.x instance.
#jdbc.mysql.driver=com.mysql.cj.jdbc.Driver
#jdbc.mysql.url=jdbc:mysql://localhost/sakila?defaultFetchSize=-2147483648
#jdbc.mysql.username=metamodel
#jdbc.mysql.password=metamodel
